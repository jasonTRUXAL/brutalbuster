# Restocks the shelves from YouTube and publishes the store to GitHub Pages —
# on every push, once a day, or on demand from the Actions tab.
name: Restock & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Restock from YouTube
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        # if YouTube is unreachable or over quota (or the result fails validation, in
        # which case sync leaves the file alone), ship the last committed catalog instead
        continue-on-error: true
        run: npm run sync
      # lint + catalog contract + unit tests; the browser smoke tests run in ci.yml
      - run: npm run check:fast
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
